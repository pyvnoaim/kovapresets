name: CI

on:
  push:
    branches: [main]
  pull_request:

# Neither lint nor core:test launches Electron, so skip its ~100MB binary.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    # Windows is the shipping target; ubuntu catches path assumptions early and
    # is the faster of the two, so PRs get a signal before Windows finishes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run core:test
